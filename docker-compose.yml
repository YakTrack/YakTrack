services:
  php:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: yaktrack_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_HOST_TESTING: mysql
      DB_PORT_TESTING: 3306
      DB_DATABASE_TESTING: yaktrack_test
      DB_USERNAME_TESTING: root
      DB_PASSWORD_TESTING: secret
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: yaktrack_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"
